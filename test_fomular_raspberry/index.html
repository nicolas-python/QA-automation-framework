<!DOCTYPE html>                     <!-- DOCTYPE = Browser, dieses Dokument verwendet den HTML5-Standard -->
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hauptseite</title>

    <!-- link = Verknüpfung mit einer externen Ressource
     rel = relationship: gibt an, welche Beziehung die Ressource zum Dokument hat
     href = gibt an welche Datei geladen werden soll -->
    <link rel="stylesheet" href="startseite_style.css">
</head>

<body>

<!-- Startseite für den Button- und Formular-Test -->
    <div class="container">
        <h1>Willkommen</h1>

        <!-- Öffnet die Info-Box -->
        <button onclick="zeigeInfo()">                  <!-- onclick = HTML-Event-Attribut wird ausgelöst wenn der Button angeklickt wird -->
            Button 1 – Info
        </button>

        <!-- Öffnet die Formular-Testseite(input felder) -->
        <button onclick="weiterleitung()">
            Button 2 – Formular
        </button>

        <!-- Öffnet die Formular-Testseite (auswahl möglichkeit)-->
        <button onclick="zeigeOptionsfeld()">
            Button 3 – Optionsfeld
        </button>

        <!-- Öffnet die Link-Testseite -->
        <button onclick="zeigeLink()">
            Button 4 – Link
        </button>

        <!-- Öffnet interaktive Unterelemente -->
        <button
            id="untermenueButton"
            aria-expanded="false"
            onclick="zeigeUntermenue()">
            Button 5 – Untermenü
        </button>

        <!-- Verstecktes Untermenü -->
        <div id="untermenue" style="display: none;">
            <button onclick="weiterleitungUntermenue()">
                Unterelement – Formular
            </button>
        </div>
    </div>




    <!-- Info-Box -->
    <div class="overlay" id="infoOverlay">
        <div class="info-box">
            <h2>Information</h2>

            <p>
                Hier kannst du deine Informationen eintragen.
            </p>

            <button class="close" onclick="schliesseInfo()">
                Schließen
            </button>
        </div>
    </div>


    <script>                <!-- script = enthält JavaScript-Code -->

        // Zeigt die versteckte Info-Box an
        function zeigeInfo()
        {
            document.getElementById("infoOverlay").style.display = "flex";
        }

        // Schließt die Info-Box wieder
        function schliesseInfo()
        {
            document.getElementById("infoOverlay").style.display = "none";
        }

        // Wechselt zur Formular-Testseite
        function weiterleitung()
        {
            window.location.href = "formular.php";
        }

        // Wechselt zur Optionsfeld-Testseite
        function zeigeOptionsfeld()
        {
            window.location.href = "optionsfeld.php";
        }

        // Wechselt zur Link-Testseite
        function zeigeLink()
        {
            window.location.href = "link.php";
        }

        // Zeigt das versteckte Untermenü an
        function zeigeUntermenue()
        {
            const menue = document.getElementById("untermenue");
            const button = document.getElementById("untermenueButton");

            menue.style.display = "block";
            button.setAttribute("aria-expanded", "true");
        }

        // Öffnet die Formular-Testseite über das interaktive Unterelement
        function weiterleitungUntermenue()
        {
            window.location.href = "formular.php";
        }
    </script>

</body>
</html>
